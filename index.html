<!DOCTYPE html>
<html lang="es" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ScriptFlow AI - Generador de Guiones Originales</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        gray: {
                            900: '#111827',
                            950: '#030712',
                        }
                    },
                    animation: {
                        'spin-slow': 'spin 3s linear infinite',
                        'pulse-fast': 'pulse 1.5s cubic-bezier(0.4, 0, 0.6, 1) infinite',
                    }
                }
            }
        }
    </script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap');
        
        body {
            font-family: 'Inter', sans-serif;
            background-color: #030712;
            color: #f3f4f6;
        }

        .custom-scrollbar::-webkit-scrollbar { width: 6px; }
        .custom-scrollbar::-webkit-scrollbar-track { background: transparent; }
        .custom-scrollbar::-webkit-scrollbar-thumb { background-color: rgba(75, 85, 99, 0.5); border-radius: 20px; }
        .custom-scrollbar:hover::-webkit-scrollbar-thumb { background-color: rgba(107, 114, 128, 0.8); }

        .toast-enter { transform: translateY(100%); opacity: 0; }
        .toast-enter-active { transform: translateY(0); opacity: 1; transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1); }
        .toast-exit { transform: translateY(0); opacity: 1; }
        .toast-exit-active { transform: translateY(100%); opacity: 0; transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1); }

        .sidebar-open { transform: translateX(0); }
        .sidebar-closed { transform: translateX(-100%); }
        @media (min-width: 768px) {
            .sidebar-closed { transform: translateX(0); }
        }
    </style>
</head>
<body class="h-screen flex overflow-hidden selection:bg-indigo-500/30">

    <!-- OVERLAY -->
    <div id="mobile-overlay" class="fixed inset-0 bg-black/50 backdrop-blur-sm z-30 hidden md:hidden" onclick="toggleSidebar()"></div>

    <!-- SIDEBAR -->
    <aside id="sidebar" class="fixed inset-y-0 left-0 z-40 w-72 bg-gray-950 border-r border-gray-800 transition-transform duration-300 ease-in-out flex flex-col sidebar-closed md:relative shadow-2xl">
        <div class="p-5 border-b border-gray-800 flex items-center justify-between">
            <div class="flex items-center gap-2">
                <div class="bg-gradient-to-br from-indigo-500 to-violet-600 w-8 h-8 rounded-lg flex items-center justify-center shadow-lg shadow-indigo-500/20">
                    <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="text-white"><polygon points="13 2 3 14 12 14 11 22 21 10 12 10 13 2"/></svg>
                </div>
                <h1 class="font-bold text-xl tracking-tight text-transparent bg-clip-text bg-gradient-to-r from-white to-gray-400">
                    ScriptFlow<span class="text-indigo-500">AI</span>
                </h1>
            </div>
            <button class="md:hidden text-gray-400 hover:text-white" onclick="toggleSidebar()">
                <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 6 6 18"/><path d="m6 6 12 12"/></svg>
            </button>
        </div>

        <div class="p-4">
            <button onclick="resetForm()" class="w-full flex items-center justify-center gap-2 bg-gray-900 hover:bg-gray-800 text-gray-300 py-2.5 rounded-xl border border-gray-700 transition-colors font-medium text-sm">
                <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14"/><path d="M12 5v14"/></svg>
                Nuevo Guion
            </button>
        </div>

        <div class="flex-1 overflow-y-auto p-4 pt-0 custom-scrollbar">
            <h2 class="text-xs font-bold text-gray-500 uppercase tracking-wider mb-4 flex items-center gap-2">
                <svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"/><path d="M3 3v5h5"/><path d="M12 7v5l4 2"/></svg>
                Mis Guiones
            </h2>
            <div id="history-list" class="space-y-3">
                <!-- History items injected here via JS -->
            </div>
            <div id="empty-history" class="text-center text-gray-600 text-sm py-8 px-4 hidden">
                <p>Aún no has generado guiones.</p>
            </div>
        </div>
    </aside>

    <!-- MAIN CONTENT -->
    <main class="flex-1 flex flex-col h-screen overflow-hidden bg-[radial-gradient(ellipse_at_top_right,_var(--tw-gradient-stops))] from-gray-900 via-black to-black relative">
        
        <!-- HEADER -->
        <header class="h-16 border-b border-gray-800/50 flex items-center px-4 md:px-8 shrink-0 bg-black/20 backdrop-blur-md">
            <button class="md:hidden p-2 text-gray-400 mr-4" onclick="toggleSidebar()">
                <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="4" x2="20" y1="12" y2="12"/><line x1="4" x2="20" y1="6" y2="6"/><line x1="4" x2="20" y1="18" y2="18"/></svg>
            </button>
            <div class="text-xs font-medium text-gray-400 flex items-center gap-2 bg-gray-900 px-3 py-1.5 rounded-full border border-gray-800">
                <span class="w-2 h-2 rounded-full bg-green-500 animate-pulse"></span>
                <span class="hidden sm:inline">Sistema Anti-Repetición</span> Activo
            </div>
        </header>

        <!-- CONTENT AREA -->
        <div class="flex-1 overflow-y-auto p-4 md:p-8 flex flex-col custom-scrollbar">
            <div class="max-w-4xl mx-auto w-full flex-1 flex flex-col">
                
                <!-- HERO (Hide when script generated) -->
                <div id="hero-section" class="mb-8 text-center pt-8 md:pt-16 transition-opacity duration-500">
                    <div class="inline-flex items-center justify-center w-16 h-16 rounded-2xl bg-gradient-to-br from-indigo-500/20 to-violet-500/10 mb-4 border border-indigo-500/20">
                        <svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="text-indigo-400"><path d="m12 3-1.912 5.813a2 2 0 0 1-1.275 1.275L3 12l5.813 1.912a2 2 0 0 1 1.275 1.275L12 21l1.912-5.813a2 2 0 0 1 1.275-1.275L21 12l-5.813-1.912a2 2 0 0 1-1.275-1.275L12 3Z"/><path d="M5 3v4"/><path d="M19 17v4"/><path d="M3 5h4"/><path d="M17 19h4"/></svg>
                    </div>
                    <h2 class="text-3xl font-bold mb-3 tracking-tight text-white">Generador de Guiones Originales</h2>
                    <p class="text-gray-400 max-w-xl mx-auto">
                        Describe tu idea. Nuestro sistema garantiza que <strong class="text-indigo-400 font-semibold">nunca</strong> generemos dos guiones iguales para el mismo tema.
                    </p>
                </div>

                <!-- FORM -->
                <div class="bg-gray-900 border border-gray-800 rounded-2xl p-6 shadow-xl mb-6">
                    <div class="mb-6">
                        <label class="block text-sm font-medium text-gray-300 mb-2 flex items-center gap-2">
                            <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="text-indigo-400"><polyline points="4 7 4 4 20 4 20 7"/><line x1="9" x2="15" y1="20" y2="20"/><line x1="12" x2="12" y1="4" y2="20"/></svg>
                            Tema o Idea del Video <span class="text-red-500">*</span>
                        </label>
                        <textarea id="input-topic" placeholder="Ej: Quiero hacer un video sobre los 3 peores errores al empezar en el gimnasio..." class="w-full bg-gray-950 border border-gray-700 text-gray-100 rounded-xl p-4 focus:ring-2 focus:ring-indigo-500 focus:border-transparent outline-none transition-all resize-none h-32"></textarea>
                    </div>

                    <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-4 gap-4 mb-6">
                        <!-- Platform -->
                        <div>
                            <label class="block text-sm font-medium text-gray-400 mb-2 flex items-center gap-2">
                                <svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect width="18" height="18" x="3" y="3" rx="2" ry="2"/><line x1="3" x2="21" y1="9" y2="9"/><line x1="9" x2="9" y1="21" y2="9"/></svg> Plataforma
                            </label>
                            <select id="input-platform" class="w-full bg-gray-950 border border-gray-700 text-gray-200 rounded-lg p-2.5 focus:ring-2 focus:ring-indigo-500 outline-none">
                                <option>TikTok</option>
                                <option>Instagram Reels</option>
                                <option>YouTube Shorts</option>
                                <option>YouTube (Largo)</option>
                            </select>
                        </div>
                        <!-- Duration -->
                        <div>
                            <label class="block text-sm font-medium text-gray-400 mb-2 flex items-center gap-2">
                                <svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg> Duración
                            </label>
                            <select id="input-duration" class="w-full bg-gray-950 border border-gray-700 text-gray-200 rounded-lg p-2.5 focus:ring-2 focus:ring-indigo-500 outline-none">
                                <option>15 segundos</option>
                                <option>30 segundos</option>
                                <option>45 segundos</option>
                                <option>60 segundos</option>
                                <option>90 segundos</option>
                                <option>2 minutos</option>
                                <option>3 minutos</option>
                                <option>5 minutos</option>
                                <option>10 minutos</option>
                            </select>
                        </div>
                        <!-- Style -->
                        <div>
                            <label class="block text-sm font-medium text-gray-400 mb-2 flex items-center gap-2">
                                <svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m12 3-1.912 5.813a2 2 0 0 1-1.275 1.275L3 12l5.813 1.912a2 2 0 0 1 1.275 1.275L12 21l1.912-5.813a2 2 0 0 1 1.275-1.275L21 12l-5.813-1.912a2 2 0 0 1-1.275-1.275L12 3Z"/></svg> Estilo
                            </label>
                            <select id="input-style" class="w-full bg-gray-950 border border-gray-700 text-gray-200 rounded-lg p-2.5 focus:ring-2 focus:ring-indigo-500 outline-none">
                                <option>Viral</option>
                                <option>Storytelling</option>
                                <option>Educativo</option>
                                <option>Misterioso</option>
                                <option>Emocional</option>
                                <option>Divertido</option>
                                <option>Profesional</option>
                            </select>
                        </div>
                        <!-- Audience -->
                        <div>
                            <label class="block text-sm font-medium text-gray-400 mb-2 flex items-center gap-2">
                                <svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><circle cx="12" cy="12" r="6"/><circle cx="12" cy="12" r="2"/></svg> Público
                            </label>
                            <input type="text" id="input-audience" placeholder="Ej: Principiantes" class="w-full bg-gray-950 border border-gray-700 text-gray-200 rounded-lg p-2.5 focus:ring-2 focus:ring-indigo-500 outline-none">
                        </div>
                    </div>

                    <button id="btn-generate" onclick="handleGenerate('new')" class="w-full py-4 rounded-xl font-bold text-white shadow-lg flex justify-center items-center gap-2 transition-all duration-300 bg-gradient-to-r from-indigo-600 to-violet-600 hover:from-indigo-500 hover:to-violet-500 hover:scale-[1.01] hover:shadow-indigo-500/25">
                        <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m12 3-1.912 5.813a2 2 0 0 1-1.275 1.275L3 12l5.813 1.912a2 2 0 0 1 1.275 1.275L12 21l1.912-5.813a2 2 0 0 1 1.275-1.275L21 12l-5.813-1.912a2 2 0 0 1-1.275-1.275L12 3Z"/></svg>
                        <span id="btn-generate-text">GENERAR GUION ORIGINAL</span>
                    </button>
                </div>

                <!-- LOADING STATE -->
                <div id="loading-state" class="hidden flex-col items-center justify-center text-gray-400 space-y-4 pt-12 pb-12">
                    <div class="relative w-16 h-16">
                        <div class="absolute inset-0 rounded-full border-t-2 border-indigo-500 animate-spin"></div>
                        <div class="absolute inset-2 rounded-full border-r-2 border-violet-500 animate-spin" style="animation-direction: reverse; animation-duration: 1.5s;"></div>
                    </div>
                    <p class="font-medium animate-pulse">Estructurando narrativa y diseñando ganchos...</p>
                </div>

                <!-- RESULT CONTAINER -->
                <div id="result-container" class="hidden flex-1 min-h-[400px]">
                    <div class="bg-gray-900 border border-gray-800 rounded-2xl shadow-xl overflow-hidden flex flex-col h-full transition-colors">
                        <div class="bg-gray-950 p-4 border-b border-gray-800 flex flex-wrap items-center justify-between gap-4">
                            <div class="flex items-center gap-3">
                                <div class="w-10 h-10 rounded-full bg-indigo-500/20 flex items-center justify-center text-indigo-400">
                                    <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="4 7 4 4 20 4 20 7"/><line x1="9" x2="15" y1="20" y2="20"/><line x1="12" x2="12" y1="4" y2="20"/></svg>
                                </div>
                                <div>
                                    <h3 id="result-topic" class="font-semibold text-gray-100 line-clamp-1 max-w-[200px] sm:max-w-xs"></h3>
                                    <p id="result-meta" class="text-xs text-gray-400 flex gap-2"></p>
                                </div>
                            </div>
                            
                            <div class="flex flex-wrap items-center gap-2">
                                <button onclick="copyCurrentScript()" class="p-2 text-gray-400 hover:text-white hover:bg-gray-800 rounded-lg transition-colors flex items-center gap-2 text-sm">
                                    <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect width="14" height="14" x="8" y="8" rx="2" ry="2"/><path d="M4 16c-1.1 0-2-.9-2-2V4c0-1.1.9-2 2-2h10c1.1 0 2 .9 2 2"/></svg> 
                                    <span class="hidden sm:inline">Copiar</span>
                                </button>
                                <button onclick="handleGenerate('improve')" id="btn-improve" class="p-2 text-orange-400 hover:bg-orange-900/30 rounded-lg transition-colors flex items-center gap-2 text-sm font-medium">
                                    <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polygon points="13 2 3 14 12 14 11 22 21 10 12 10 13 2"/></svg>
                                    <span class="hidden sm:inline">Mejorar Retención</span>
                                </button>
                                <button onclick="handleGenerate('new')" id="btn-another" class="p-2 text-indigo-400 hover:bg-indigo-900/30 rounded-lg transition-colors flex items-center gap-2 text-sm font-medium">
                                    <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"/><path d="M3 3v5h5"/></svg>
                                    Generar Otro
                                </button>
                            </div>
                        </div>
                        
                        <div class="p-6 md:p-8 flex-1 overflow-y-auto bg-[#0a0a0c]">
                            <div id="result-content" class="max-w-3xl mx-auto font-sans">
                                <!-- Script text injected here -->
                            </div>
                        </div>
                    </div>
                </div>

            </div>
        </div>
    </main>

    <!-- TOAST NOTIFICATION -->
    <div id="toast" class="fixed bottom-6 right-6 z-50 toast-enter hidden">
        <div id="toast-bg" class="flex items-center gap-3 px-5 py-3 rounded-xl shadow-xl border bg-green-950/90 border-green-900/50 text-green-200">
            <svg id="toast-icon-success" xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><path d="m9 12 2 2 4-4"/></svg>
            <svg id="toast-icon-error" class="hidden" xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><line x1="12" x2="12" y1="8" y2="12"/><line x1="12" x2="12.01" y1="16" y2="16"/></svg>
            <span id="toast-msg" class="font-medium text-sm">Mensaje</span>
        </div>
    </div>

    <script>
        // --- CONSTANTS & STATE ---
        const API_KEY = ""; // El API Key se inyectará dinámicamente en el entorno de Canvas
        const API_URL = `https://generativelanguage.googleapis.com/v1beta/models/gemini-3-flash-preview:generateContent?key=${API_KEY}`;
        const STORAGE_KEY = 'scriptflow_history_v1';
        
        let history = [];
        let currentScriptId = null;
        let isGenerating = false;

        // --- DOM ELEMENTS ---
        const els = {
            sidebar: document.getElementById('sidebar'),
            overlay: document.getElementById('mobile-overlay'),
            inputTopic: document.getElementById('input-topic'),
            inputPlatform: document.getElementById('input-platform'),
            inputDuration: document.getElementById('input-duration'),
            inputStyle: document.getElementById('input-style'),
            inputAudience: document.getElementById('input-audience'),
            btnGenerate: document.getElementById('btn-generate'),
            btnGenerateText: document.getElementById('btn-generate-text'),
            heroSection: document.getElementById('hero-section'),
            loadingState: document.getElementById('loading-state'),
            resultContainer: document.getElementById('result-container'),
            resultTopic: document.getElementById('result-topic'),
            resultMeta: document.getElementById('result-meta'),
            resultContent: document.getElementById('result-content'),
            historyList: document.getElementById('history-list'),
            emptyHistory: document.getElementById('empty-history'),
            toast: document.getElementById('toast'),
            toastBg: document.getElementById('toast-bg'),
            toastMsg: document.getElementById('toast-msg'),
            toastIconSuccess: document.getElementById('toast-icon-success'),
            toastIconError: document.getElementById('toast-icon-error'),
            btnImprove: document.getElementById('btn-improve'),
            btnAnother: document.getElementById('btn-another')
        };

        // --- INITIALIZATION ---
        function init() {
            loadHistory();
            renderHistory();
        }

        // --- UI UTILS ---
        function toggleSidebar() {
            els.sidebar.classList.toggle('sidebar-open');
            els.sidebar.classList.toggle('sidebar-closed');
            els.overlay.classList.toggle('hidden');
        }

        function showToast(message, type = 'success') {
            els.toastMsg.textContent = message;
            
            if (type === 'error') {
                els.toastBg.className = 'flex items-center gap-3 px-5 py-3 rounded-xl shadow-xl border bg-red-950/90 border-red-900/50 text-red-200';
                els.toastIconError.classList.remove('hidden');
                els.toastIconSuccess.classList.add('hidden');
            } else {
                els.toastBg.className = 'flex items-center gap-3 px-5 py-3 rounded-xl shadow-xl border bg-green-950/90 border-green-900/50 text-green-200';
                els.toastIconError.classList.add('hidden');
                els.toastIconSuccess.classList.remove('hidden');
            }

            els.toast.classList.remove('hidden', 'toast-exit', 'toast-exit-active');
            els.toast.classList.add('toast-enter-active');
            
            setTimeout(() => {
                els.toast.classList.remove('toast-enter-active');
                els.toast.classList.add('toast-exit-active');
                setTimeout(() => els.toast.classList.add('hidden'), 300);
            }, 3000);
        }

        function setLoading(isLoading) {
            isGenerating = isLoading;
            if (isLoading) {
                els.btnGenerate.classList.add('opacity-50', 'cursor-not-allowed');
                els.btnGenerate.disabled = true;
                els.btnGenerateText.innerHTML = '<svg class="animate-spin -ml-1 mr-2 h-5 w-5 text-white inline" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24"><circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle><path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path></svg> Generando...';
                
                els.heroSection.classList.add('hidden');
                els.resultContainer.classList.add('hidden');
                els.loadingState.classList.remove('hidden');
                els.loadingState.classList.add('flex');
                
                els.btnImprove.disabled = true;
                els.btnAnother.disabled = true;
                els.btnImprove.classList.add('opacity-50');
                els.btnAnother.classList.add('opacity-50');
            } else {
                els.btnGenerate.classList.remove('opacity-50', 'cursor-not-allowed');
                els.btnGenerate.disabled = false;
                els.btnGenerateText.textContent = 'GENERAR GUION ORIGINAL';
                
                els.loadingState.classList.add('hidden');
                els.loadingState.classList.remove('flex');
                
                els.btnImprove.disabled = false;
                els.btnAnother.disabled = false;
                els.btnImprove.classList.remove('opacity-50');
                els.btnAnother.classList.remove('opacity-50');
            }
        }

        function resetForm() {
            els.inputTopic.value = '';
            els.inputAudience.value = '';
            currentScriptId = null;
            els.resultContainer.classList.add('hidden');
            els.heroSection.classList.remove('hidden');
            renderHistory(); // Refresh to remove active selection
            if (window.innerWidth < 768) toggleSidebar();
        }

        // --- HISTORY MANAGEMENT ---
        function loadHistory() {
            try {
                const saved = localStorage.getItem(STORAGE_KEY);
                if (saved) history = JSON.parse(saved);
            } catch (e) { console.error("Error loading history", e); }
        }

        function saveHistory() {
            localStorage.setItem(STORAGE_KEY, JSON.stringify(history));
            renderHistory();
        }

        function deleteHistoryItem(id, event) {
            if(event) event.stopPropagation();
            history = history.filter(item => item.id !== id);
            saveHistory();
            if (currentScriptId === id) resetForm();
            showToast('Guion eliminado');
        }

        function loadScriptFromHistory(id) {
            const scriptData = history.find(item => item.id === id);
            if (!scriptData) return;
            
            currentScriptId = id;
            els.inputTopic.value = scriptData.topic;
            els.inputPlatform.value = scriptData.platform;
            els.inputDuration.value = scriptData.duration;
            els.inputStyle.value = scriptData.style;
            els.inputAudience.value = scriptData.audience || '';
            
            displayResult(scriptData);
            if (window.innerWidth < 768) toggleSidebar();
        }

        function renderHistory() {
            els.historyList.innerHTML = '';
            
            if (history.length === 0) {
                els.emptyHistory.classList.remove('hidden');
                return;
            }
            
            els.emptyHistory.classList.add('hidden');
            
            history.forEach(item => {
                const isActive = item.id === currentScriptId;
                const div = document.createElement('div');
                div.className = `group relative p-4 rounded-xl cursor-pointer transition-all border ${isActive ? 'bg-indigo-900/20 border-indigo-500/50 shadow-sm' : 'bg-gray-900 border-gray-800 hover:border-gray-700 hover:bg-gray-800/80'}`;
                div.onclick = () => loadScriptFromHistory(item.id);
                
                div.innerHTML = `
                    <p class="text-sm font-medium text-gray-200 line-clamp-2 leading-tight mb-2">${item.topic}</p>
                    <div class="flex flex-wrap gap-1.5 mt-2">
                        <span class="text-[10px] px-2 py-0.5 bg-gray-950 border border-gray-800 rounded-md text-gray-400">${item.platform}</span>
                        <span class="text-[10px] px-2 py-0.5 bg-gray-950 border border-gray-800 rounded-md text-gray-400">${item.duration}</span>
                    </div>
                    <button onclick="deleteHistoryItem('${item.id}', event)" class="absolute top-3 right-3 text-gray-500 hover:text-red-500 opacity-0 group-hover:opacity-100 transition-opacity">
                        <svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 6h18"/><path d="M19 6v14c0 1-1 2-2 2H7c-1 0-2-1-2-2V6"/><path d="M8 6V4c0-1 1-2 2-2h4c1 0 2 1 2 2v2"/><line x1="10" x2="10" y1="11" y2="17"/><line x1="14" x2="14" y1="11" y2="17"/></svg>
                    </button>
                `;
                els.historyList.appendChild(div);
            });
        }

        function displayResult(scriptData) {
            els.heroSection.classList.add('hidden');
            els.resultContainer.classList.remove('hidden');
            
            els.resultTopic.textContent = scriptData.topic;
            els.resultMeta.innerHTML = `<span>${scriptData.platform}</span> • <span>${scriptData.duration}</span> • <span>${scriptData.style}</span>`;
            
            // Format Script Text
            let html = '';
            const lines = scriptData.script.split('\n');
            lines.forEach(line => {
                if (line.match(/^\d+:\d+\s*[—\-]\s*[A-ZÁÉÍÓÚÑ\s]+/)) {
                    html += `<div class="mt-6 mb-2"><span class="inline-block bg-indigo-900/50 text-indigo-300 px-3 py-1 rounded-md text-xs font-bold tracking-wider border border-indigo-500/30">${line.trim()}</span></div>`;
                } else if (line.trim() !== '') {
                    html += `<p class="text-gray-300 leading-relaxed text-[1.05rem] mb-2">${line}</p>`;
                }
            });
            
            els.resultContent.innerHTML = html;
            renderHistory(); // Update active state in sidebar
        }

        async function copyCurrentScript() {
            if (!currentScriptId) return;
            const scriptObj = history.find(s => s.id === currentScriptId);
            if (!scriptObj) return;

            try {
                await navigator.clipboard.writeText(scriptObj.script);
                showToast('Copiado al portapapeles');
            } catch (err) {
                // Fallback
                const textArea = document.createElement("textarea");
                textArea.value = scriptObj.script;
                document.body.appendChild(textArea);
                textArea.select();
                try {
                    document.execCommand('copy');
                    showToast('Copiado al portapapeles');
                } catch (ex) {
                    showToast('No se pudo copiar', 'error');
                }
                document.body.removeChild(textArea);
            }
        }

        async function handleGenerate(mode = 'new') {
            const topic = els.inputTopic.value.trim();
            if (!topic) {
                showToast('Por favor, escribe un tema para el video.', 'error');
                els.inputTopic.focus();
                return;
            }

            const platform = els.inputPlatform.value;
            const duration = els.inputDuration.value;
            const style = els.inputStyle.value;
            const audience = els.inputAudience.value;

            setLoading(true);

            // Fetch previous scripts for anti-repetition logic
            const relatedScripts = history.filter(s => s.topic.toLowerCase().includes(topic.toLowerCase().substring(0, 5))).slice(0, 3);
            
            let systemPrompt = `Eres ScriptFlow AI, un guionista experto especializado en contenido viral y de alta retención para redes sociales. 
TU ÚNICO OBJETIVO es escribir guiones para videos. NO generes imágenes, hashtags ni ideas extra, solo el guion exacto.
REGLAS ESTRICTAS DE FORMATO:
- Debes usar OBLIGATORIAMENTE el siguiente formato para indicar tiempos y secciones (todo en mayúscula después del guion):
  [MM:SS] — [SECCIÓN]
  [Texto que se va a decir]
- Ejemplo: 
  0:00 — GANCHO
  ¿Sabías que estás perdiendo dinero todos los días y no te das cuenta?
  0:05 — DESARROLLO
  La mayoría de las personas...
REGLAS DE RETENCIÓN:
- NUNCA uses introducciones genéricas ("Hola", "Bienvenidos", "Hoy vamos a hablar").
- Empieza con un gancho explosivo, curioso, un problema fuerte o una historia.
- Usa "micro-ganchos" a mitad del guion para reconectar la atención.
- Escribe de forma natural, ágil y conversacional.`;

            let userPrompt = "";

            if (mode === 'improve' && currentScriptId) {
                const currentScriptObj = history.find(s => s.id === currentScriptId);
                userPrompt = `Tengo el siguiente guion sobre: "${topic}".
Guion actual:
"""
${currentScriptObj.script}
"""
OBJETIVO: Mejora drásticamente la RETENCIÓN de este guion. 
- Haz el gancho más agresivo o curioso.
- Mejora el ritmo de las frases (hazlas más dinámicas).
- Añade micro-ganchos impactantes.
- Mantén la información principal.
- Respeta ESTRICTAMENTE el formato de tiempos y secciones.`;
            } else {
                userPrompt = `Crea un guion original.
Tema: ${topic}
Plataforma: ${platform}
Duración objetivo: ${duration}
Estilo: ${style}
Público objetivo: ${audience || 'General'}`;

                if (relatedScripts.length > 0) {
                    const pastContext = relatedScripts.map((s, i) => `Guion anterior ${i+1}:\n${s.script.substring(0, 300)}...`).join('\n\n');
                    userPrompt += `\n\n⚠️ REGLA CRÍTICA DE ANTI-REPETICIÓN:
El usuario ya ha generado guiones sobre este tema anteriormente. Aquí tienes fragmentos de lo que ya se generó:
---
${pastContext}
---
TU NUEVO GUION DEBE SER COMPLETAMENTE DIFERENTE A LOS ANTERIORES. 
- NO uses la misma estructura narrativa.
- NO uses el mismo tipo de gancho (si antes usaste pregunta, usa una historia o dato chocante).
- Cambia el ángulo, el enfoque y el orden de ideas. 
- Sorpréndeme.`;
                }
            }

            const payload = {
                contents: [{ parts: [{ text: userPrompt }] }],
                systemInstruction: { parts: [{ text: systemPrompt }] }
            };

            try {
                const response = await fetch(API_URL, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                });
                
                if (!response.ok) throw new Error(`HTTP error! status: ${response.status}`);
                
                const result = await response.json();
                
                if (result.error) {
                    throw new Error(result.error.message || 'Error en la API');
                }

                const generatedText = result.candidates?.[0]?.content?.parts?.[0]?.text;
                
                if (!generatedText) throw new Error('Respuesta vacía de la API');

                const newScriptObj = {
                    id: Date.now().toString(),
                    topic, platform, duration, style, audience,
                    script: generatedText,
                    date: new Date().toISOString()
                };

                if (mode === 'improve' && currentScriptId) {
                    // Update existing
                    history = history.map(h => h.id === currentScriptId ? newScriptObj : h);
                } else {
                    // Add new
                    history.unshift(newScriptObj);
                }

                currentScriptId = newScriptObj.id;
                saveHistory();
                displayResult(newScriptObj);
                
                showToast(mode === 'improve' ? 'Retención mejorada' : 'Guion generado con éxito');

            } catch (error) {
                console.error("API Error:", error);
                showToast('Error al conectar con la IA. Verifica la consola.', 'error');
            } finally {
                setLoading(false);
            }
        }

        // Run init
        window.addEventListener('DOMContentLoaded', init);
    </script>
</body>
</html>
